name: Create Release

on:
  push:
    tags:
      - 'v*' # Trigger only when a tag starting with 'v' is pushed

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write # Required to create a release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI Workloads
        run: dotnet workload restore

      - name: Build and Publish
        run: |
          dotnet restore
          dotnet publish -f net8.0-windows10.0.19041.0 -c Release --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:RuntimeIdentifier=win-x64
        shell: pwsh

      - name: Sign Windows executable
        env:
          CODE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.CODE_SIGNING_CERTIFICATE_BASE64 }}
          CODE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.CODE_SIGNING_CERTIFICATE_PASSWORD }}
          CODE_SIGNING_TIMESTAMP_URL: ${{ secrets.CODE_SIGNING_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $publishPath = Join-Path $env:GITHUB_WORKSPACE 'bin\Release\net8.0-windows10.0.19041.0\win-x64\publish'
          $executablePath = Join-Path $publishPath 'SuzerainSaveEditor.exe'
          $certificatePath = Join-Path $env:RUNNER_TEMP 'suzerain-code-signing.pfx'

          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGNING_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:CODE_SIGNING_CERTIFICATE_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:CODE_SIGNING_TIMESTAMP_URL)) {
            Write-Host 'Code-signing secrets are not fully configured; publishing without signing.'
            exit 0
          }

          $certificateBytes = [Convert]::FromBase64String($env:CODE_SIGNING_CERTIFICATE_BASE64)
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)

          try {
            $signTool = Get-ChildItem `
              -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Filter signtool.exe `
              -Recurse `
              -File |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1

            if ($null -eq $signTool) {
              throw 'signtool.exe was not found on the GitHub-hosted Windows runner.'
            }

            & $signTool.FullName sign `
              /fd SHA256 `
              /td SHA256 `
              /tr $env:CODE_SIGNING_TIMESTAMP_URL `
              /f $certificatePath `
              /p $env:CODE_SIGNING_CERTIFICATE_PASSWORD `
              $executablePath

            if ($LASTEXITCODE -ne 0) {
              throw "signtool.exe signing failed with exit code $LASTEXITCODE."
            }

            & $signTool.FullName verify /pa /all $executablePath
            if ($LASTEXITCODE -ne 0) {
              throw "signtool.exe verification failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            if (Test-Path $certificatePath) {
              Remove-Item $certificatePath -Force
            }
          }
        shell: pwsh

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/net8.0-windows10.0.19041.0/win-x64/publish/SuzerainSaveEditor.exe
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: CHANGELOG.md
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}