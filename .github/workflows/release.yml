name: Create Release

on:
  push:
    tags:
      - 'v*' # Trigger only when a tag starting with 'v' is pushed

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write # Required to create a release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI Workloads
        run: dotnet workload restore

      - name: Read release signing mode
        id: signing-mode
        run: |
          $mode = (git tag -l "${{ github.ref_name }}" --format="%(contents)").Trim()
          if ($mode -ne "sign" -and $mode -ne "nosign") {
            throw "Release tag must be annotated with signing mode 'sign' or 'nosign'."
          }
          "mode=$mode" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Build and Publish
        run: |
          dotnet restore
          dotnet publish -f net8.0-windows10.0.19041.0 -c Release --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:RuntimeIdentifier=win-x64
        shell: pwsh

      - name: Sign Windows executable
        if: steps.signing-mode.outputs.mode == 'sign'
        env:
          CODE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.CODE_SIGNING_CERTIFICATE_BASE64 }}
          CODE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.CODE_SIGNING_CERTIFICATE_PASSWORD }}
          CODE_SIGNING_TIMESTAMP_URL: ${{ secrets.CODE_SIGNING_TIMESTAMP_URL }}
          CODE_SIGNING_GENERATE_SELF_SIGNED: "false"
        run: |
          & "$env:GITHUB_WORKSPACE\sign-windows-executable.ps1" `
            -ExecutablePath "$env:GITHUB_WORKSPACE\bin\Release\net8.0-windows10.0.19041.0\win-x64\publish\SuzerainSaveEditor.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Code signing failed."
          }
        shell: pwsh

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/net8.0-windows10.0.19041.0/win-x64/publish/SuzerainSaveEditor.exe
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: CHANGELOG.md
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}